name: Seed presentation corpus

on:
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Maximum official sources to crawl (breadth-first across agencies; 0 = all)"
        required: true
        default: "100"
      max_docs_per_source:
        description: "Maximum new/not-yet-archived records per source"
        required: true
        default: "1"
      max_pages_per_source:
        description: "Maximum pages/resources visited per source"
        required: true
        default: "3"
      max_depth:
        description: "Maximum navigation depth within each reading room"
        required: true
        default: "1"

concurrency:
  group: seed-presentation-corpus
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      FOIA_API_KEY: ${{ secrets.FOIA_API_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      FOIA_STORAGE_BACKEND: b2
      FOIA_DB_PATH: data/foia_archive.db
      FOIA_FILES_DIR: data/files
      B2_MAX_ARCHIVE_BYTES: "9000000000"
      FOIA_CRAWLER_DRY_RUN: "false"
      FOIA_SOURCE_LIMIT: ${{ inputs.source_limit }}
      FOIA_MAX_DOCS_PER_SOURCE: ${{ inputs.max_docs_per_source }}
      FOIA_MAX_PAGES_PER_SOURCE: ${{ inputs.max_pages_per_source }}
      FOIA_MAX_DEPTH: ${{ inputs.max_depth }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify required secrets exist
        shell: bash
        run: |
          missing=0
          for name in FOIA_API_KEY B2_KEY_ID B2_APPLICATION_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed or extend presentation corpus
        run: python scripts/seed_presentation_corpus.py

      - name: Preserve crawl logs and database for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-corpus-run-${{ github.run_id }}
          path: |
            data/foia_archive.db
          if-no-files-found: ignore
          retention-days: 7
