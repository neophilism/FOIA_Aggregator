name: Autonomous corpus refresh

on:
  schedule:
    - cron: "17 4 * * 2,5"
  workflow_dispatch:

concurrency:
  group: foia-b2-single-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      FOIA_STORAGE_BACKEND: b2
      FOIA_DB_PATH: data/foia_archive.db
      FOIA_FILES_DIR: data/files
      B2_MAX_ARCHIVE_BYTES: "8500000000"
      FOIA_EXPANSION_TARGET_TOTAL_BYTES: "9000000000"
      FOIA_EXPANSION_MAX_WAVES: "1"
      FOIA_CRAWLER_DRY_RUN: "false"
      FOIA_SOURCE_LIMIT: "0"
      FOIA_MAX_DOCS_PER_SOURCE: "1"
      FOIA_MAX_PAGES_PER_SOURCE: "5"
      FOIA_MAX_DEPTH: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Backblaze secrets
        shell: bash
        run: |
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"

      - name: Install extraction system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y antiword catdoc tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve FOIA.gov API key
        env:
          REPO_FOIA_API_KEY: ${{ secrets.FOIA_API_KEY }}
        run: |
          if [ -n "$REPO_FOIA_API_KEY" ]; then
            echo "::add-mask::$REPO_FOIA_API_KEY"
            echo "FOIA_API_KEY=$REPO_FOIA_API_KEY" >> "$GITHUB_ENV"
            exit 0
          fi
          python - <<'PY'
          import os
          import re
          import requests
          from bs4 import BeautifulSoup

          repo = requests.get(
              "https://api.github.com/repos/usdoj/foia.gov",
              timeout=30,
          )
          repo.raise_for_status()
          branch = repo.json()["default_branch"]
          spec = requests.get(
              f"https://raw.githubusercontent.com/usdoj/foia.gov/{branch}/swagger.json",
              timeout=30,
          )
          spec.raise_for_status()
          text = BeautifulSoup(
              spec.json()["info"]["description"],
              "html.parser",
          ).get_text(" ", strip=True)
          match = re.search(
              r"use\s+the\s+following\s+api[_ -]?key\s+for\s+testing\.?\s*([A-Za-z0-9_-]{20,})",
              text,
              flags=re.IGNORECASE,
          )
          if not match:
              raise SystemExit("Could not recover FOIA.gov published testing API key")
          key = match.group(1)
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"FOIA_API_KEY={key}\n")
          PY

      - name: Run one autonomous refresh wave
        run: python scripts/expand_corpus.py
