name: Post-37 corpus continuation

on:
  push:
    branches:
      - ops/post-37-corpus-expansion

concurrency:
  group: corpus-expansion
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      PYTHONPATH: .
      WAIT_FOR_RUN_ID: "37399548442"
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      FOIA_STORAGE_BACKEND: b2
      FOIA_DB_PATH: data/foia_archive.db
      FOIA_FILES_DIR: data/files
      B2_MAX_ARCHIVE_BYTES: "8500000000"
      FOIA_EXPANSION_TARGET_TOTAL_BYTES: "9000000000"
      FOIA_EXPANSION_MAX_WAVES: "6"
      FOIA_EXPANSION_MIN_PROGRESS_BYTES: "1"
      FOIA_CRAWLER_DRY_RUN: "false"
      FOIA_SOURCE_LIMIT: "0"
      FOIA_MAX_DOCS_PER_SOURCE: "20"
      FOIA_MAX_PAGES_PER_SOURCE: "25"
      FOIA_MAX_DEPTH: "2"

    steps:
      - uses: actions/checkout@v4

      - name: Wait for wave 1 to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          run_id = os.environ["WAIT_FOR_RUN_ID"]
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          while True:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
              status = run.get("status")
              conclusion = run.get("conclusion")
              print(f"Wave 1 status={status} conclusion={conclusion}", flush=True)
              if status == "completed":
                  if conclusion != "success":
                      raise SystemExit(
                          f"Wave 1 did not succeed: conclusion={conclusion}"
                      )
                  break
              time.sleep(30)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Backblaze secrets
        shell: bash
        run: |
          test -n "$B2_KEY_ID"
          test -n "$B2_APPLICATION_KEY"

      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y antiword catdoc tesseract-ocr
          command -v antiword
          command -v xls2csv
          command -v catppt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve FOIA.gov API key
        env:
          REPO_FOIA_API_KEY: ${{ secrets.FOIA_API_KEY }}
        run: |
          if [ -n "$REPO_FOIA_API_KEY" ]; then
            echo "::add-mask::$REPO_FOIA_API_KEY"
            echo "FOIA_API_KEY=$REPO_FOIA_API_KEY" >> "$GITHUB_ENV"
            exit 0
          fi

          python - <<'PY'
          import os
          import re
          import requests
          from bs4 import BeautifulSoup

          repo = requests.get(
              "https://api.github.com/repos/usdoj/foia.gov",
              timeout=30,
          )
          repo.raise_for_status()
          branch = repo.json()["default_branch"]
          spec = requests.get(
              f"https://raw.githubusercontent.com/usdoj/foia.gov/{branch}/swagger.json",
              timeout=30,
          )
          spec.raise_for_status()
          text = BeautifulSoup(
              spec.json()["info"]["description"],
              "html.parser",
          ).get_text(" ", strip=True)
          match = re.search(
              r"use\s+the\s+following\s+api[_ -]?key\s+for\s+testing\.?\s*([A-Za-z0-9_-]{20,})",
              text,
              flags=re.IGNORECASE,
          )
          if not match:
              raise SystemExit("Could not recover FOIA.gov published testing API key")
          key = match.group(1)
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"FOIA_API_KEY={key}\n")
          PY

      - name: Restore newest verified database
        run: python main.py bootstrap-db --destination data/foia_archive.db

      - name: Reindex newly supported legacy Office records
        run: python main.py reindex-text

      - name: Checkpoint reindexed database
        run: python main.py backup-db --force

      - name: Run deeper capacity-aware expansion
        run: python scripts/expand_corpus.py

      - name: Preserve final database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-37-corpus-continuation-${{ github.run_id }}
          path: data/foia_archive.db
          if-no-files-found: ignore
          retention-days: 7
