name: MVP live acceptance crawl

on:
  push:
    branches:
      - acceptance/mvp-live-crawl
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Run live acceptance crawl
        run: python scripts/mvp_acceptance_crawl.py

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-live-acceptance-report
          path: acceptance-results/
          if-no-files-found: warn
