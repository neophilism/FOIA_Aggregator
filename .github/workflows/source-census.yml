name: FOIA source census

on:
  push:
    branches:
      - feat/source-census
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Resolve FOIA.gov API key for census
        env:
          REPO_FOIA_API_KEY: ${{ secrets.FOIA_API_KEY }}
        run: |
          if [ -n "$REPO_FOIA_API_KEY" ]; then
            echo "::add-mask::$REPO_FOIA_API_KEY"
            echo "FOIA_API_KEY=$REPO_FOIA_API_KEY" >> "$GITHUB_ENV"
            exit 0
          fi

          python - <<'PY'
          import os
          import re
          import requests
          from bs4 import BeautifulSoup

          url = "https://stg-www.foia.gov/swagger.html"
          response = requests.get(url, timeout=30)
          response.raise_for_status()
          text = BeautifulSoup(response.text, "html.parser").get_text(" ", strip=True)
          match = re.search(
              r"use\s+the\s+following\s+api[_ -]?key\s+for\s+testing\.?\s*([A-Za-z0-9_-]{20,})",
              text,
              flags=re.IGNORECASE,
          )
          if not match:
              raise SystemExit("Could not recover FOIA.gov's published testing API key.")

          api_key = match.group(1)
          print(f"::add-mask::{api_key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"FOIA_API_KEY={api_key}\n")
          PY

      - name: Run complete source census
        run: >
          python scripts/source_census.py
          --probe
          --probe-workers 12
          --probe-timeout 12
          --probe-delay 0.25
          --max-html-kb 256
          --output-dir source-census-results

      - name: Upload census reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foia-source-census
          path: source-census-results/
          if-no-files-found: warn
