name: FOIA source census

on:
  push:
    branches:
      - feat/source-census
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOIA_API_KEY: ${{ secrets.FOIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Verify census API key is configured
        run: |
          if [ -z "$FOIA_API_KEY" ]; then
            echo "FOIA_API_KEY repository secret is required for the live census."
            exit 2
          fi

      - name: Run complete source census
        run: >
          python scripts/source_census.py
          --probe
          --probe-workers 12
          --probe-timeout 12
          --probe-delay 0.25
          --max-html-kb 256
          --output-dir source-census-results

      - name: Upload census reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foia-source-census
          path: source-census-results/
          if-no-files-found: warn
