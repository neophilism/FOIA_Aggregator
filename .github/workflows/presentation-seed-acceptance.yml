name: Presentation seed acceptance

on:
  push:
    branches:
      - ops/presentation-seed-acceptance

concurrency:
  group: presentation-seed-acceptance
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      FOIA_API_KEY: ${{ secrets.FOIA_API_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      FOIA_STORAGE_BACKEND: b2
      FOIA_DB_PATH: data/foia_archive.db
      FOIA_FILES_DIR: data/files
      B2_MAX_ARCHIVE_BYTES: "9000000000"
      FOIA_CRAWLER_DRY_RUN: "false"
      FOIA_SOURCE_LIMIT: "10"
      FOIA_MAX_DOCS_PER_SOURCE: "1"
      FOIA_MAX_PAGES_PER_SOURCE: "2"
      FOIA_MAX_DEPTH: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify required secrets exist
        shell: bash
        run: |
          missing=0
          for name in FOIA_API_KEY B2_KEY_ID B2_APPLICATION_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 10-source live seed acceptance
        run: python scripts/seed_presentation_corpus.py
