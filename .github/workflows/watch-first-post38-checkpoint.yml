name: Watch first post-38 checkpoint

on:
  push:
    branches:
      - ops/watch-first-post38-checkpoint

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      FOIA_STORAGE_BACKEND: b2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for first post-38 checkpoint
        run: |
          python - <<'PY'
          import time

          from foia_archive.archive_storage import B2ArchiveStorage, get_archive_storage
          from foia_archive.utils import load_config

          config = load_config("config/settings.yaml")
          backend = get_archive_storage(config)
          if not isinstance(backend, B2ArchiveStorage):
              raise SystemExit("B2 storage is not configured")

          cutoff = "database-backups/20261006T133900Z"
          for attempt in range(40):
              backups = backend.current_object_manifest(prefix="database-backups/")
              new_keys = sorted(key for key in backups if key > cutoff)
              if new_keys:
                  usage = backend.usage_summary()
                  documents = backend.current_object_manifest(prefix="documents/")
                  print(f"CHECKPOINT_KEY={new_keys[-1]}")
                  print(f"CHECKPOINT_BYTES={backups[new_keys[-1]]}")
                  print(f"B2_USAGE_BYTES={usage.stored_bytes}")
                  print(f"B2_DOCUMENT_VERSION_BYTES={usage.document_bytes}")
                  print(f"B2_BACKUP_VERSION_BYTES={usage.backup_bytes}")
                  print(f"CURRENT_DOCUMENT_OBJECTS={len(documents)}")
                  print(f"CURRENT_DOCUMENT_BYTES={sum(documents.values())}")
                  raise SystemExit(0)
              print(f"CHECKPOINT_PENDING attempt={attempt + 1}")
              time.sleep(20)

          raise SystemExit("No post-38 checkpoint appeared during watch window")
          PY
