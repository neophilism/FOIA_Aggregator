crawler:
  dry_run: true
  max_docs_per_source: 10
  interval_hours: 6
  daemon_error_retry_seconds: 60
  failed_source_retry_minutes: 60
  max_pages_per_source: 50
  max_depth: 3
  max_discovered_docs_per_source: 1000
  page_timeout_seconds: 30
  page_max_size_mb: 5
  per_host_delay_seconds: 0.5
  user_agent: "FOIAArchiveBot/0.1 (+https://github.com/neophilism/FOIA_Aggregator)"

foia_hub:
  base_url: "https://api.foia.gov/api"
  timeout_seconds: 30
  max_retries: 5
  retry_backoff_seconds: 1
  max_retry_delay_seconds: 60
  refresh_interval_minutes: 360
  failure_retry_minutes: 15
  # api_key can be provided here or via the FOIA_API_KEY environment variable.
  api_key: ""

downloader:
  timeout_seconds: 60
  max_file_size_mb: 100
  max_redirects: 5
  max_retries: 3
  retry_backoff_seconds: 1
  max_retry_delay_seconds: 60
  download_failure_retry_minutes: 60
  permanent_download_failure_retry_minutes: 1440

search:
  # Bound per-document indexed text so one unusually large release cannot
  # dominate SQLite memory/disk.
  max_indexed_chars_per_document: 5000000

ocr:
  enabled: true
  languages: "eng"
  dpi: 200
  max_pages_per_document: 50
  page_timeout_seconds: 45
  max_image_megapixels: 20

database_backup:
  enabled: true
  interval_hours: 24
  retain_count: 3
  prefix: "database-backups"

storage:
  # Use FOIA_STORAGE_BACKEND=b2 in production after B2 credentials are set.
  backend: "local"
  db_path: "data/foia_archive.db"
  # Local backend archive directory; also used as a temporary staging area
  # before verified B2 uploads.
  files_dir: "data/files"
  b2:
    bucket: ""
    region: ""
    endpoint_url: ""
    # Keep the initial archive below Backblaze's free 10 GB allowance.
    max_archive_bytes: 9000000000
