services:
  - type: web
    name: foia-aggregator
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FOIA_STORAGE_BACKEND
        value: b2
      - key: FOIA_BOOTSTRAP_DB_FROM_B2
        value: "true"
      - key: FOIA_ADMIN_USERNAME
        value: admin
      - key: FOIA_AUTONOMOUS_REFRESH_ENABLED
        value: "true"
      - key: FOIA_CRAWLER_DRY_RUN
        value: "false"
      - key: FOIA_MAX_DOCS_PER_SOURCE
        value: "1"
      - key: FOIA_CRAWLER_INTERVAL_HOURS
        value: "6"
      - key: FOIA_MAX_PAGES_PER_SOURCE
        value: "5"
      - key: FOIA_MAX_DEPTH
        value: "1"
      - key: FOIA_DB_PATH
        value: /data/foia_archive.db
      - key: FOIA_FILES_DIR
        value: /data/files
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_MAX_ARCHIVE_BYTES
        value: "8500000000"
